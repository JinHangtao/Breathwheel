<!DOCTYPE html>

<title>呼吸宇宙 · 生成式曼陀罗</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none; -webkit-touch-callout:none; -webkit-text-size-adjust:100%; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }

  }

    background:linear-gradient(135deg,rgba(var(--ac),.10),rgba(var(--ac),.02) 60%),rgba(12,9,7,.34);
    -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
    box-shadow:inset 0 0 0 1px rgba(var(--ac),.15), inset 0 1px 0 rgba(255,255,255,.07), 0 10px 36px rgba(0,0,0,.38), 0 0 calc(14px + 26px*var(--lv)) rgba(var(--ac),calc(.03 + .15*var(--lv)));
    opacity:0; transform:translateY(-10px) scale(.9); transform-origin:100% 0;
    transition:grid-template-columns 1s var(--ease), opacity 1.8s var(--ease) .3s, transform 1.8s var(--ease) .3s; }
  #mus.show .cap { opacity:1; transform:none; }
  #mus.shake .cap { animation:mshake .6s var(--ease); }
  @keyframes mshake { 0%,100% { translate:0; } 20% { translate:-5px; } 45% { translate:4px; } 70% { translate:-2px; } }
  #mus.open .cap, #mus .cap:focus-within { grid-template-columns:44px 1fr; }
  #mus .body { min-width:0; overflow:hidden; opacity:0; transition:opacity .5s var(--ease); cursor:default; }
  #mus.open .body, #mus .cap:focus-within .body { opacity:1; transition-delay:.2s; }
  #mus:not(.has)[data-s=idle] .body { cursor:pointer; }
  #mus .in { display:flex; align-items:center; height:44px; width:max-content; padding:0 6px 0 2px; }
  #mus .orb { position:relative; width:44px; height:44px; border-radius:50%; color:rgba(var(--ac),.82); transition:transform .5s var(--spring), color .5s; }
  #mus .orb:hover { color:rgb(var(--ac)); }
  #mus .orb:active { transform:scale(.9); transition-duration:.15s; }
  #mus .orb:focus-visible, #mus .swap:focus-visible { box-shadow:inset 0 0 0 1.5px rgba(var(--ac),.6); }
  #mus .ring { position:absolute; inset:0; width:44px; height:44px; transform:rotate(-90deg); }
  #mus .ring circle { fill:none; stroke-width:1.2; }
  #mus .trk { stroke:rgba(var(--ac),.16); }
  #mus .prg { stroke:rgba(var(--ac),.9); stroke-linecap:round; stroke-dasharray:122.52; stroke-dashoffset:122.52; opacity:0; transition:opacity .8s; }
  #mus.has .prg { opacity:1; }
  #mus[data-s=idle] .trk { stroke:rgba(var(--ac),.45); animation:trkb 4.6s ease-in-out infinite; }
  @keyframes trkb { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  #mus[data-s=busy] .ring { animation:mspin 1.5s linear infinite; }
  #mus[data-s=busy] .prg { opacity:1; stroke-dasharray:34 100 !important; stroke-dashoffset:0 !important; }
  @keyframes mspin { from { transform:rotate(-90deg); } to { transform:rotate(270deg); } }
  #mus .ic { position:absolute; left:13px; top:13px; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
    opacity:0; transform:scale(.55) rotate(-24deg); filter:blur(3px); transition:opacity .45s var(--ease), transform .7s var(--ease), filter .45s var(--ease); }

  #mus .ttl.ov { -webkit-mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 14px),transparent); mask-image:linear-gradient(90deg,transparent,#000 8px,#000 calc(100% - 14px),transparent); }
  #mus .mq { display:inline-block; will-change:transform; }
  @keyframes mq { 0%,16% { transform:translateX(0); } 46%,62% { transform:translateX(var(--ov)); } 92%,100% { transform:translateX(0); } }
  #mus .sub { font-size:10px; line-height:12px; letter-spacing:.22em; white-space:nowrap; overflow:hidden; color:rgba(var(--ac),.5); font-variant-numeric:tabular-nums; }
  #mus .eq { display:flex; align-items:center; gap:3px; height:16px; width:0; margin-left:0; opacity:0; overflow:hidden; transition:width .9s var(--ease), margin .9s var(--ease), opacity .7s; }
  #mus.has .eq { width:17px; margin-left:12px; opacity:1; }
  #mus .eq i { flex:none; width:2px; height:16px; border-radius:2px; background:rgba(var(--ac),.75); transform:scaleY(.16); }
  #mus .swap { flex:none; display:grid; place-items:center; width:0; height:30px; margin-left:0; border-radius:50%; overflow:hidden; opacity:0; visibility:hidden; color:rgba(var(--ac),.55);

  #mus.has .swap { width:30px; margin-left:6px; opacity:1; visibility:visible; transition-delay:0s; }

  #mus .swap svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; transition:transform .8s var(--ease); }

  #mus .seek:hover .ln { height:4px; top:7px; }

  #drop { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; visibility:hidden; overflow:hidden;

    transition:opacity .7s var(--ease), backdrop-filter .9s var(--ease), -webkit-backdrop-filter .9s var(--ease), visibility 0s .7s;

  body.drag #drop .rg { animation:dring 3.6s cubic-bezier(.2,.6,.3,1) infinite; }
  #drop .rg:nth-child(2) { animation-delay:1.2s; } #drop .rg:nth-child(3) { animation-delay:2.4s; }
  @keyframes dring { 0% { transform:scale(.55); opacity:0; } 22% { opacity:.65; } 100% { transform:scale(3.6); opacity:0; } }
  #drop .core { position:relative; display:flex; flex-direction:column; align-items:center; gap:22px; opacity:0; transform:translateY(10px) scale(.96); transition:opacity .8s var(--ease) .1s, transform 1s var(--ease) .1s; }

  #drop .gl svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes dgl { 0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(var(--ac),.0); } 50% { transform:scale(1.07); box-shadow:0 0 34px 2px rgba(var(--ac),.22); } }
  #drop b { font-weight:300; font-size:15px; letter-spacing:.6em; text-indent:.6em; }
  #drop small { font-size:11px; letter-spacing:.3em; opacity:.5; margin-top:-8px; }
  #drop .tx { display:none; }
  body.pre #drop .t-pre, body:not(.pre):not(.hasm) #drop .t-new, body:not(.pre).hasm #drop .t-rep { display:block; }
  #micB { position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:5; --ml:0;
    width:44px; height:44px; border-radius:50%; padding:0; margin:0; border:0; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent;
    color:rgba(var(--ac),.5); background:linear-gradient(135deg,rgba(var(--ac),.10),rgba(var(--ac),.02) 60%),rgba(12,9,7,.34);
    -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
    box-shadow:inset 0 0 0 1px rgba(var(--ac),.15), inset 0 1px 0 rgba(255,255,255,.07), 0 10px 36px rgba(0,0,0,.38), 0 0 calc(8px + 34px*var(--ml)) rgba(var(--ac),calc(.35*var(--ml)));
    visibility:hidden; opacity:0; transform:scale(.9); transition:opacity .5s, transform .5s var(--spring), color .5s, visibility 0s .5s; }
  #micB.show { visibility:visible; opacity:1; transform:none; transition:opacity 1.8s var(--ease) .3s, transform .5s var(--spring), color .5s; }
  #micB:active { transform:scale(.9); transition-duration:.15s; }
  /* 按钮默认隐去：点击画面浮现，无操作数秒后淡出；鼠标停在按钮上或音乐胶囊展开时保持 */
  body:not(.ui) #mus { pointer-events:none; }
  body:not(.ui) #mus.show .cap { opacity:0; transform:translateY(-8px) scale(.94); transition:grid-template-columns 1s var(--ease), opacity 1.4s var(--ease), transform 1.4s var(--ease); }
  body:not(.ui) #micB.show { opacity:0; transform:translateY(8px) scale(.9); pointer-events:none; transition:opacity 1.4s var(--ease), transform 1.4s var(--ease), color .5s; }
  body.ui #mus.show .cap { transition:grid-template-columns 1s var(--ease), opacity .7s var(--ease), transform .7s var(--ease); }
  body.ui #micB.show { transition:opacity .7s var(--ease), transform .5s var(--spring), color .5s; }
  #micB:focus-visible { box-shadow:inset 0 0 0 1.5px rgba(var(--ac),.6); }
  #micB svg { position:absolute; left:13px; top:13px; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  #micB .sl { transition:opacity .4s; }
  #micB[data-s=on] { color:rgb(var(--ac)); }
  #micB[data-s=on] .sl, #micB[data-s=cal] .sl { opacity:0; }
  #micB[data-s=cal] { color:rgb(var(--ac)); animation:micc 1s ease-in-out infinite; }
  @keyframes micc { 0%,100% { opacity:.4; } 50% { opacity:1; } }
  /* ===== 触屏 / 小屏适配 ===== */
  @media (pointer:coarse) {
    #mus .swap { height:40px; }
    #mus.has .swap { width:40px; margin-left:2px; }
    #mus .seek { height:30px; }
    #mus .seek .ln, #mus .seek:hover .ln { top:14px; }
    #hint { letter-spacing:.2em; font-size:12px; }
  }
  @media (max-width:480px) {
    #hint { letter-spacing:.12em; font-size:11px; max-width:calc(100vw - 128px); bottom:calc(22px + env(safe-area-inset-bottom, 0px)); }
    #enter { letter-spacing:.5em; text-indent:.5em; }
    #mus .txt { width:132px; }
  }
  @media (max-height:480px) {
    #hint { bottom:calc(12px + env(safe-area-inset-bottom, 0px)); }
    #mus { top:calc(10px + env(safe-area-inset-top,0px)); }
    #micB { bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
  }
  @media (min-width:700px) and (pointer:coarse) {
    #hint { font-size:13px; }
  }
  @media (prefers-reduced-motion:reduce) { #mus *, #mus, #drop, #drop * { animation-duration:.01ms !important; transition-duration:.01ms !important; transition-delay:0s !important; } }
</style>

      <svg class="ic i-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 18V6.2l9-2V16"/><circle cx="7.6" cy="18.2" r="2.4"/><circle cx="16.6" cy="16.2" r="2.4"/></svg>
      <svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 6.6v10.8l8.4-5.4z"/></svg>

    </button>

      <div class="txt"><div class="ttl" id="musTw"><span class="mq" id="musT">载入音乐</span></div><div class="sub" id="musS">点击选择 · 或拖入文件</div></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const COARSE = matchMedia('(pointer:coarse)').matches || matchMedia('(hover:none)').matches;   // 触屏设备：手机 / 平板
  const BT = COARSE ? 3 : 6;                                                                    // 泛光采样数：触屏减半，省电省 GPU
  if (COARSE) document.getElementById('hint').textContent = '轻点 唤出按钮 · 再点 转换 · 按住 呼吸 · 双指滑动 变换视角 · 点麦克风 用声音呼吸';
  document.addEventListener('gesturestart', e => e.preventDefault());                           // 禁止 iOS 双指缩放页面
  const gl = canvas.getContext('webgl', {antialias:false, powerPreference:'high-performance'});
  if (!gl) { document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:20px">你的浏览器不支持 WebGL</p>'; return; }

  const vsSrc = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;

  const fsSrc = `
  precision highp float;
  uniform vec2  u_res;
  uniform float u_time, u_breath, u_mode;
  uniform float u_depth, u_fb, u_fbZoom, u_fbRot;
  uniform sampler2D u_prev;
  uniform float u_low, u_mid, u_high, u_pulse, u_pAge, u_voice;
  uniform vec2  u_mouse, u_par, u_vel;
  uniform float u_presence, u_press, u_speed;
  uniform vec2  u_rc[6];   // 涟漪中心
  uniform vec4  u_rp[6];   // age, speed, width, decay
  uniform vec4  u_rq[6];   // strength(±), gap, wobble, seed
  uniform vec4  u_rr[6];   // rings, light, tint, lobes
  uniform vec3  u_trail[12];
  uniform float u_rs;
  uniform vec4  u_sw;      // 光幕扫过: 方向xy, 位置, 强度
  uniform vec4  u_sk[4];   // 萤火: x, y, 锐度, 亮度
  uniform float u_hue;     // 棱镜偏色事件
  uniform vec4  u_em[5];   // 中心扩散: 半径, 光环强度, 后期强度, 中心柔光包络
  #define TAU 6.28318530718

  float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*f*(f*(f*6.-15.)+10.);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
               mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
  }
  float fbm(vec2 p){
    float v = 0., a = .5;
    mat2 m = mat2(.8, .6, -.6, .8) * 2.02;
    for(int i = 0; i < 4; i++){ v += a * noise(p); p = m * p; a *= .5; }
    return v;
  }
  vec3 hueRot(vec3 c, float a){
    const vec3 k = vec3(.57735);
    float ca = cos(a), sa = sin(a);
    return c * ca + cross(k, c) * sa + k * dot(k, c) * (1. - ca);
  }
  mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

  vec3 scene(vec2 uv, float sym, float mode, float t, float br, float lift){
    uv *= rot(t * .12);
    // 环境：由滚轮深度驱动的连续、可逆的参数漂移
    float e1 = .5 + .5 * sin(u_depth * .37 + .6);
    float e2 = .5 + .5 * sin(u_depth * .23 + 2.1);
    float fs = mix(1.7, 2.4, e1);      // 流场尺度
    float wr = mix(2.6, 4.0, e2);      // 扭曲强度

    float wave = exp(-wd * wd) * u_pulse;
    vec2 p = vec2(cos(a), sin(a)) * rr;

    vec2 w = vec2(fbm(p * fs + wr * q + vec2(1.7, 9.2) + t * .22),

    col += line * wave * .45;

    return col;

  void main(){

  const fsPresent = `

  function hb_breathStep(dt){
    const now = performance.now(), on = AE.on();
    const hold = on && (hb_kHold || (pDownT > 0 && now - pDownT > 250));
    const st = AE.micState(), mL = st === 'on' ? AE.micLevel() : 0;
    hb_snd = st === 'on' && mL > (hb_snd ? .12 : .2);            // 出声判定带迟滞
    hb_sndT = hb_snd ? hb_sndT + dt : 0;
    if (hold) { hb_fMode = 1; hb_fIdle = 0; }
    else if (hb_sndT > .25 && hb_fMode !== 2) { hb_fMode = 2; hb_fIdle = 0; }   // 持续出声近半秒才接管，一声拍手不算
    if (hb_fMode && !hold && !(hb_fMode === 2 && hb_snd)) hb_fIdle += dt;
    if (hb_fMode && hb_fIdle > 10) hb_fMode = 0;

    let want = .57, inhale = false;
    if (hb_fMode) {
      inhale = hb_fMode === 1 ? hold : !hb_snd;
      const fast = hb_fMode === 2, vm = fast ? (inhale ? 2.2 : 1.8) : (inhale ? 1 : .8), tgt = hb_near(breathPhase, inhale ? hb_PK : hb_TR);
      want = Math.max(-vm, Math.min(vm, (tgt - breathPhase) * (fast ? 1.8 : .75)));
      if (!hb_told[hb_fMode]) { hb_told[hb_fMode] = 1; hb_toast(hb_fMode === 1 ? '跟随你的呼吸 · 按住吸气，松开呼气' : '跟随你的声音 · 出声呼气，安静吸气', 3800); }
      if (hb_wasInhale && !inhale && hb_bf(breathPhase) > .7 && now - hb_lastExT > 1200) { hb_lastExT = now; emit(.35 + .45 * hb_bf(breathPhase)); }   // 从吸满转为呼出：荡开一圈
    }
    hb_wasInhale = hb_fMode ? inhale : false;
    hb_bv += (want - hb_bv) * (1 - Math.exp(-dt * (hb_fMode === 2 ? 7 : 3)));
    breathPhase += dt * hb_bv;

    if (micB.dataset.s !== st) micB.dataset.s = st;
    const ml = Math.round(mL * 40) / 40;
    if (ml !== hb_micLastL) { hb_micLastL = ml; micB.style.setProperty('--ml', ml); }
  }

  async function hb_toggleMic(){
    uiShow(3200);
    if (!AE.on()) { hb_toast('先点击进入，再开启麦克风'); return; }
    const r = await AE.micToggle();
    if (r === 'on') hb_toast('麦克风已开启 · 先安静一秒校准 · 建议佩戴耳机', 5200);
    else if (r === 'off') hb_toast('麦克风已关闭');
    else if (r === 'denied') hb_toast('没有获得麦克风权限');
    else if (r === 'unsupported' || r === 'noctx') hb_toast('此环境无法使用麦克风（需要 https 或本地打开）', 4800);
  }
  AE.hooks.micEnd = () => hb_toast('麦克风已断开');
  ['pointerdown', 'click'].forEach(ev => micB.addEventListener(ev, e => e.stopPropagation()));
  micB.addEventListener('click', e => { e.currentTarget.blur(); hb_toggleMic(); });
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('#mus')) return;
    if (e.code === 'KeyV' && !e.repeat) hb_toggleMic();
    else if (e.code === 'KeyB') hb_kHold = true;
  });
  addEventListener('keyup', e => { if (e.code === 'KeyB') hb_kHold = false; });
  addEventListener('blur', () => { hb_kHold = false; });
  addEventListener('contextmenu', e => e.preventDefault());

  // 连续的时间累加（不会因标签页切换而跳变）
  let last = performance.now(), time = 0, real = 0, breathPhase = 0;

  function frame(now){
    const rawDt = (now - last) / 1000;
    let dt = Math.min(rawDt, .05), tdt = Math.min(rawDt, .12);   // tdt：时间轴补偿，低帧率时流动不再变成慢动作
    last = now;
    // 自适应画质：持续掉帧时逐级降低场景渲染分辨率
    if (rawDt < .2) perfEma += (rawDt - perfEma) * .05;
    if (perfEma > .024 && now - lastDrop > 2500 && RSI < RSL.length - 1) { RS = RSL[++RSI]; lastDrop = now; perfEma = .0167; resize(); }
    real += dt;
    directorUpdate(dt);

    // 呼吸：周期约 11 秒，吸快呼慢的不对称曲线
    hb_breathStep(dt);
    const s = Math.sin(breathPhase);
    const breath = .5 + .5 * (s + .18 * Math.sin(2 * breathPhase + 1.2)) / 1.18;

    const W = canvas.width, H = canvas.height, mn = Math.min(W, H);

    // 闲置：光点自己缓缓游走，像有呼吸的生命
    idleT += dt;
    const idleGoal = idleT > 7 ? 1 : 0;
    idleMix += (idleGoal - idleMix) * (1 - Math.exp(-dt * (idleGoal ? .5 : 1.2)));
    const wx = W * .5 + (Math.sin(real * .21) * .26 + Math.sin(real * .53 + 1.3) * .07) * mn;
    const wy = H * .5 + (Math.cos(real * .17 + .4) * .20 + Math.sin(real * .41) * .06) * mn;
    const ex = target.x + (wx - target.x) * idleMix;
    const ey = target.y + (wy - target.y) * idleMix;

    spring(sx, ex, dt, 4.2, 1);  spring(sy, ey, dt, 4.2, 1);
    spring(px, ex, dt, 1.8, 1);    spring(py, ey, dt, 1.8, 1);
    spring(prs, pressT, dt, 5, 1);
    dotP.x += (ex - dotP.x) * (1 - Math.exp(-dt * 10));
    dotP.y += (ey - dotP.y) * (1 - Math.exp(-dt * 10));

    // 速度（平滑）→ 拖拽 / 轨迹 / 流动加速
    let vx = sx.v / mn, vy = sy.v / mn;
    const vl = Math.hypot(vx, vy);
    if (vl > 2) { vx *= 2 / vl; vy *= 2 / vl; }
    const kv = 1 - Math.exp(-dt * 4);
    velS.x += (vx - velS.x) * kv; velS.y += (vy - velS.y) * kv;
    speedF = Math.min(Math.hypot(velS.x, velS.y) * .8, 1);

    spring(depth, depthT, dt, 2.0, 1);
    const wsGoal = Math.min(Math.abs(depth.v) * 1.1, 1);
    wheelSpeed += (wsGoal - wheelSpeed) * (1 - Math.exp(-dt * (wsGoal > wheelSpeed ? 6 : 2.2)));
    const ls = .30 * Math.sin(depth.x * .45);
    const zf = Math.max(-.03, Math.min(.03, (ls - lastLs) * 2.2));
    const rf = Math.max(-.03, Math.min(.03, (depth.x - lastDepth) * .12 * 1.5));
    lastLs = ls; lastDepth = depth.x;
    fbZoom += (zf - fbZoom) * .5; fbRot += (rf - fbRot) * .5;
    const fbAmt = .66 * wheelSpeed * wheelSpeed * (3 - 2 * wheelSpeed);

    voiceV = AE.on() ? AE.micVoice() : 0;
    time += tdt * slowV * (1 + .7 * env.mid + .6 * speedF + .75 * wheelSpeed + 1.6 * voiceV);

    // 在场感：离开窗口 / 抬手 → 光慢慢退去；闲置 → 半亮
    const pGoal = (1 - idleMix) * (inside ? 1 : 0) + idleMix * .5;
    presence += (pGoal - presence) * (1 - Math.exp(-dt * (pGoal > presence ? 1.5 : 1)));

    // 轨迹采样
    trailTimer += dt;
    if (trailTimer >= .03) {
      trailTimer = 0;
      trail.unshift({x: sx.x, y: sy.x, t: real}); trail.pop();
    }
    for (let i = 0; i < TR; i++) {
      trailBuf[i*3] = trail[i].x; trailBuf[i*3+1] = trail[i].y;
      trailBuf[i*3+2] = Math.max(0, real - trail[i].t);
    }
    for (let i = 0; i < RN; i++) rp[i*4] += dt;

    modeV += (modeT - modeV) * (1 - Math.exp(-dt * .9));
    if (Math.abs(modeT - modeV) < .0005) modeV = modeT;

    const fade = Math.min(real / 3.5, 1);

    if (AE.on()) {
      AE.update(breath, sy.x / H, Math.min(Math.hypot(ex - sx.x, ey - sy.x) / mn * 3, 1), dt);
    }
    uiTick();
    pAge += dt; pulse *= Math.exp(-dt * .7); combo *= Math.exp(-dt * .7);

    // 每次呼吸到顶点，从中心呼出一圈扩散
    const bn = Math.floor((breathPhase - 1.37) / (Math.PI * 2));
    if (hb_fMode) lastBn = bn; else if (bn > lastBn && real > 3.2) { lastBn = bn; emit(.75); }
    for (let i = 0; i < EMN; i++) {
      emAge[i] += dt;
      const a = emAge[i], st = emStr[i];
      const ss = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
      const TAU_R = .9;
      emBuf[i*4]   = emSpd[i] * (a - TAU_R * (1 - Math.exp(-a / TAU_R)));        // 光环半径：由内慢慢起步，再匀速外扩
      emBuf[i*4+1] = st * ss(a / 1.1) * Math.exp(-a * .5);                        // 光环亮度：柔和渐入、缓缓淡出
      emBuf[i*4+2] = st * Math.pow(Math.sin(Math.PI * Math.min(a / 7.5, 1)), 1.6); // 四角模糊/色差
      emBuf[i*4+3] = st * ss(a / 1.5) * Math.exp(-a * .62);                       // 中心柔光包络
    }
    const cbf = ph => .5 + .5 * (Math.sin(ph) + .18 * Math.sin(2 * ph + 1.2)) / 1.18;
    for (let i = 0; i < 4; i++) cb[i] = cbf(breathPhase - i * Math.PI / 2);
    const postBase = .24 + .24 * wheelSpeed;

    gl.uniform2f(U.u_res, W, H);
    gl.uniform1f(U.u_time, time);
    gl.uniform2f(U.u_mouse, sx.x, sy.x);
    gl.uniform2f(U.u_par, (px.x - W * .5) / mn, (py.x - H * .5) / mn);
    gl.uniform2f(U.u_vel, velS.x, velS.y);
    gl.uniform2fv(U.u_rc, rc); gl.uniform4fv(U.u_rp, rp); gl.uniform4fv(U.u_rq, rq); gl.uniform4fv(U.u_rr, rr);
    gl.uniform1f(U.u_presence, presence);
    gl.uniform1f(U.u_press, Math.max(-.25, Math.min(1.2, prs.x)));
    gl.uniform1f(U.u_speed, speedF);
    gl.uniform3fv(U.u_trail, trailBuf);
    gl.uniform1f(U.u_breath, breath);
    gl.uniform1f(U.u_mode, modeV);
    gl.uniform1f(U.u_voice, voiceV); gl.uniform1f(U.u_low, env.low); gl.uniform1f(U.u_mid, env.mid); gl.uniform1f(U.u_high, env.high);
    gl.uniform1f(U.u_pulse, pulse); gl.uniform1f(U.u_pAge, pAge);
    gl.uniform1f(U.u_depth, depth.x);
    gl.uniform1f(U.u_fb, Math.max(fbAmt, .5 * stallK));
    gl.uniform1f(U.u_fbZoom, fbZoom + .006 * stallK);
    gl.uniform1f(U.u_fbRot, fbRot);
    gl.uniform4fv(U.u_em, emBuf); gl.uniform1f(U.u_rs, RS);
    gl.uniform4fv(U.u_sw, swBuf); gl.uniform4fv(U.u_sk, skBuf); gl.uniform1f(U.u_hue, hueV);

    // pass 1：场景 + 与上一帧混合 → 写入缓冲
    const rd = T[ti], wr = T[1 - ti];
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rd.tex);
    gl.uniform1i(U.u_prev, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, wr.fbo); gl.viewport(0, 0, TW, TH);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // pass 2：输出到屏幕（胶片颗粒 + 淡入）
    gl.useProgram(progP);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.bindTexture(gl.TEXTURE_2D, wr.tex);
    gl.uniform1i(UP.u_tex, 0);
    gl.uniform2f(UP.u_res, W, H);
    gl.uniform1f(UP.u_time, time);
    gl.uniform1f(UP.u_glow, Math.min(1.6, .38 + .22 * breath + .9 * voiceV + .25 * env.low));
    gl.uniform1f(UP.u_fade, fade * fade * (3 - 2 * fade));
    gl.uniform4fv(UP.u_em, emBuf); gl.uniform1f(UP.u_base, postBase); gl.uniform1f(UP.u_mode, modeV); gl.uniform4fv(UP.u_cb, cb);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.useProgram(prog);
    ti = 1 - ti;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
